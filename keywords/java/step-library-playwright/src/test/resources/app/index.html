<!doctype html>
<html>
<head><meta charset="utf-8"><title>Register</title></head>
<body>
<form id="form">
  <label>Full name <input id="name" placeholder="Your name"></label>
  <label for="email">E-mail</label> <input id="email" type="email" data-testid="email">
  <label>Country
    <select id="country"><option value="ch">Switzerland</option><option value="fr">France</option></select>
  </label>
  <label><input id="terms" type="checkbox"> I accept the terms</label>
  <button id="register" type="button">Register</button>
</form>
<p id="result" hidden></p>
<script>
  // The confirmation appears later, like an answer from a server.
  document.getElementById('register').addEventListener('click', () => {
    const name = document.getElementById('name').value;
    const terms = document.getElementById('terms').checked;
    const country = document.getElementById('country').value;
    setTimeout(() => {
      const result = document.getElementById('result');
      result.textContent = terms ? 'Welcome ' + name + ' (' + country + ')' : 'Please accept the terms';
      result.hidden = false;
    }, 300);
  });
</script>
</body>
</html>
